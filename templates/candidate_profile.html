<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Candid AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --royal-blue: #002366;
            --indigo-dark: #1e1b4b;
            --sidebar-width: 260px;
            --bg-light: #f8fafc;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            display: flex;
            color: #1e293b;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--indigo-dark);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
        }

        .nav-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.1); color: white; }
        .nav-link.active { background: var(--royal-blue); }

        /* --- Main Content --- */
        .main-content {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
        }

        .top-navbar {
            height: 75px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 40px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #e2e8f0;
            z-index: 999;
        }

        .user-actions { display: flex; align-items: center; gap: 15px; }
        .user-profile-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: 99px;
            font-weight: 600;
            color: var(--indigo-dark);
            border: 1px solid #e2e8f0;
        }

        .nav-logout-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: #fee2e2;
            color: #b91c1c;
            text-decoration: none;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: var(--transition);
        }

        /* --- Profile Form Section --- */
        .content-body { padding: 40px; max-width: 900px; margin: 0 auto; }
        
        .profile-card {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--indigo-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Camera Styling --- */
        .biometric-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 35px;
        }

        .camera-container {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 4/3;
            background: #000;
            margin: 0 auto 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        #webcam-view { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #captured-photo { width: 100%; height: 100%; object-fit: cover; display: none; }

        .btn-cam-group { display: flex; justify-content: center; gap: 12px; }
        .btn-cam {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        #start-btn { background: #64748b; color: white; }
        #capture-btn { background: var(--royal-blue); color: white; }
        #capture-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* --- Form Elements --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--royal-blue);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 35, 102, 0.05);
        }

        input[readonly] { background: #f1f5f9; color: #64748b; }

        .submit-btn {
            background: var(--royal-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.3s;
        }
        .submit-btn:hover { background: var(--indigo-dark); transform: translateY(-2px); }

        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 20px 10px; }
            .sidebar span { display: none; }
            .main-content { margin-left: 70px; width: calc(100% - 70px); }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="#" class="sidebar-logo">
            <span>✨</span>
            <span>Candid AI</span>
        </a>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{{ url_for('candidate_jobs') }}" class="nav-link">
                    <i class="fas fa-briefcase"></i> <span>Opportunities</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('candidate_profile') }}" class="nav-link active">
                    <i class="fas fa-user-circle"></i> <span>My Profile</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('candidate_messages') }}" class="nav-link">
                    <i class="fas fa-envelope"></i> <span>Messages</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-navbar">
            <div class="user-actions">
                <div class="user-profile-tag">
                    <i class="fas fa-user"></i>
                    <span>{{ session['user_name'] if session['user_name'] else 'Candidate' }}</span>
                </div>
                <a href="{{ url_for('logout') }}" class="nav-logout-inline">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </header>

        <div class="content-body">
            <div class="profile-card">
                <form method="POST" enctype="multipart/form-data" id="profileForm">
                    
                    <div class="section-title"><i class="fas fa-face-smile"></i> Face Enrollment</div>
                    <div class="biometric-box">
                        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px;">
                            Verification photo required for AI-proctored assessments.
                        </p>
                        <div class="camera-container">
                            <video id="webcam-view" autoplay playsinline></video>
                            <img id="captured-photo" src="" alt="Captured Photo">
                        </div>
                        <input type="hidden" name="profile_image_data" id="profile-image-data">
                        <div class="btn-cam-group">
                            <button type="button" id="start-btn" class="btn-cam">Start Camera</button>
                            <button type="button" id="capture-btn" class="btn-cam" disabled>Capture Snapshot</button>
                        </div>
                        <p id="snapshot-msg" style="display: none; color: #16a34a; font-weight: 700; margin-top: 15px;">
                            <i class="fas fa-check-circle"></i> Ready to save
                        </p>
                    </div>

                    <div class="section-title"><i class="fas fa-id-card"></i> Personal Information</div>
                    
                    <div class="form-group" style="margin-bottom: 25px;">
                        <label>Registered Email (Fixed)</label>
                        <input type="email" value="{{ candidate.email }}" readonly>
                    </div>

                    <div class="form-grid">
                        <div class="full-width">
                            <label>Full Name</label>
                            <input type="text" name="name" value="{{ candidate.name or '' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" name="dob" value="{{ candidate.dob or '' }}" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" value="{{ candidate.phone or '' }}" placeholder="+91..." required>
                        </div>
                        <div class="full-width">
                            <label>Residential Address</label>
                            <textarea name="address" rows="3" required>{{ candidate.address or '' }}</textarea>
                        </div>
                        <div class="full-width">
                            <label>Update Resume (PDF/DOCX)</label>
                            <input type="file" name="resume" accept=".pdf,.doc,.docx">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('webcam-view');
        const photo = document.getElementById('captured-photo');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const dataInput = document.getElementById('profile-image-data');
        const msg = document.getElementById('snapshot-msg');
        let stream = null;

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                video.style.display = 'block';
                photo.style.display = 'none';
                msg.style.display = 'none';
                captureBtn.disabled = false;
                startBtn.innerText = "Retake Photo";
            } catch (err) {
                alert("Please enable camera access for identity enrollment.");
            }
        });

        captureBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);

            const dataURL = canvas.toDataURL('image/jpeg', 0.9);
            photo.src = dataURL;
            photo.style.display = 'block';
            video.style.display = 'none';
            dataInput.value = dataURL;
            msg.style.display = 'block';
            
            stream.getTracks().forEach(t => t.stop());
            captureBtn.disabled = true;
        });
    </script>
</body>
</html>
