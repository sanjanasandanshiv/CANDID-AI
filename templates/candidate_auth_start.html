<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | Secure Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* --- Root & Layout --- */
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
        }

        body { 
            background: var(--bg); 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-wrap { width: 100%; max-width: 480px; padding: 20px; }

        /* --- Verification Card --- */
        .auth-card {
            background: #fff; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05);
            padding: 40px; 
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        .auth-card h2 { 
            margin: 0 0 10px; 
            font-size: 1.5rem; 
            color: #1e293b; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-card p { 
            color: #64748b; 
            font-size: 0.95rem; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }

        /* --- Video Container & Scanning Effect --- */
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
            aspect-ratio: 4 / 3;
            border: 4px solid #e2e8f0;
            transition: border-color 0.3s ease;
        }

        video#authVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The Animated Scanning Line */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(37, 99, 235, 0.6);
            box-shadow: 0 0 15px 2px rgba(37, 99, 235, 0.8);
            z-index: 10;
            display: none;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Status Borders */
        .video-container.ready { border-color: var(--primary); }
        .video-container.verifying { border-color: #fbbf24; }
        .video-container.success { border-color: var(--success); }
        .video-container.failed { border-color: var(--error); }

        /* --- Status Box --- */
        .status-box {
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 0.9rem;
            font-weight: 600; 
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .status-idle     { background: #f1f5f9; color: #475569; }
        .status-checking { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .status-success  { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-error    { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* --- Button --- */
        .btn-verify {
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: #fff;
            border: none; 
            border-radius: 12px; 
            font-size: 1rem; 
            font-weight: 700;
            cursor: pointer; 
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-verify:hover:not(:disabled) { 
            background: #1d4ed8; 
            transform: translateY(-2px);
        }

        .btn-verify:disabled { 
            background: #cbd5e1; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        /* --- Spinner --- */
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3); 
            border-top-color: #fff;
            border-radius: 50%; 
            animation: spin 0.8s linear infinite;
            vertical-align: middle; 
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link { 
            display: inline-block; 
            margin-top: 20px; 
            color: #94a3b8; 
            font-size: 0.85rem; 
            text-decoration: none; 
            font-weight: 500;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <h2><span>🔒</span> Identity Verification</h2>
        <p>Position your face within the frame and look directly at the camera to begin your test for <strong>{{ job_title }}</strong>.</p>

        <div class="video-container" id="video-wrap">
            <div class="scan-line" id="scan-line"></div>
            <video id="authVideo" autoplay muted playsinline></video>
        </div>

        <div class="status-box status-idle" id="status-box">
            Initializing camera...
        </div>

        <button class="btn-verify" id="btn-verify" disabled onclick="verify()">
            Verify &amp; Start Test
        </button>

        <a href="{{ url_for('candidate_jobs') }}" class="back-link">← Cancel and return to jobs</a>
    </div>
</div>

<script>
    const JOB_ID = {{ job_id | int }};
    let stream = null;
    const videoWrap = document.getElementById('video-wrap');
    const scanLine = document.getElementById('scan-line');

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('authVideo').srcObject = stream;
            videoWrap.classList.add('ready');
            setStatus('idle', '✅ Camera ready. Please stay still.');
            document.getElementById('btn-verify').disabled = false;
        } catch (e) {
            setStatus('error', '❌ Camera blocked. Please enable camera access.');
        }
    }

    function captureFrame() {
        const video = document.getElementById('authVideo');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        return canvas.toDataURL('image/jpeg', 0.9);
    }

    async function verify() {
        const btn = document.getElementById('btn-verify');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Analyzing...';
        
        // Start scanning animation
        scanLine.style.display = 'block';
        videoWrap.className = 'video-container verifying';
        setStatus('checking', '⏳ Verifying identity against profile...');

        const imageData = captureFrame();

        try {
            const resp = await fetch(`/candidate/test/verify/${JOB_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });

            const data = await resp.json();

            if (data.success) {
                videoWrap.className = 'video-container success';
                scanLine.style.display = 'none';
                setStatus('success', '✅ Identity Confirmed. Redirecting...');
                
                if (stream) stream.getTracks().forEach(t => t.stop());

                // setTimeout(() => {
                //     window.location.href = data.redirect;
                // }, 1200);

                console.log("Verification Success:", data);

                // Stop camera immediately
                if (stream) stream.getTracks().forEach(t => t.stop());

                // Show success
                videoWrap.className = 'video-container success';
                scanLine.style.display = 'none';
                setStatus('success', '✅ Identity Confirmed. Redirecting to test...');

                // 🚀 FORCE REDIRECT (NO DELAY)
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    console.error("No redirect URL received!");
                    setStatus('error', '❌ No redirect URL received from server.');
                }

            } else {
                videoWrap.className = 'video-container failed';
                scanLine.style.display = 'none';
                setStatus('error', '❌ ' + (data.message || 'Face does not match. Try again.'));
                btn.disabled = false;
                btn.innerHTML = 'Try Verification Again';
            }
        } catch (e) {
            videoWrap.className = 'video-container failed';
            scanLine.style.display = 'none';
            setStatus('error', '❌ Connection error. Check your internet.');
            btn.disabled = false;
            btn.innerHTML = 'Try Again';
        }
    }

    function setStatus(type, text) {
        const box = document.getElementById('status-box');
        box.className = 'status-box';
        box.classList.add('status-' + type);
        box.textContent = text;
    }

    window.onload = startCamera;
</script>

</body>
</html>
