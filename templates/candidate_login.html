<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Login | Talent Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.login-page {
            background: radial-gradient(circle at top right, #002366, #000b1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-logo-container {
            width: 70px;
            height: 70px;
            background: #f0f7ff;
            color: #002366;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        .login-card h2 { color: #0f172a; font-size: 1.75rem; margin-bottom: 8px; font-weight: 800; }
        .login-card p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 22px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 8px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.prefix-icon { position: absolute; left: 16px; color: #94a3b8; }
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #002366;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 35, 102, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #002366;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-login:hover { background: #001a4d; transform: translateY(-2px); }

        .auth-footer { margin-top: 25px; color: #64748b; font-size: 0.9rem; }
        .auth-footer a { color: #002366; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo-container"><i class="fas fa-briefcase"></i></div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to manage your applications</p>

        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope prefix-icon"></i>
                    <input type="email" name="email" required placeholder="name@email.com">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-key prefix-icon"></i>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn-login">
                <span>Sign In</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>New here? <a href="{{ url_for('candidate_signup') }}">Create account</a></p>
            <a href="{{ url_for('index') }}" style="font-size: 0.8rem; color: #94a3b8;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
