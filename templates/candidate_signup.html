<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Candidate Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body.signup-page {
            background: radial-gradient(circle at top left, #002366, #000b1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .signup-card h2 { color: #0f172a; font-size: 1.75rem; margin-bottom: 8px; font-weight: 800; }
        .signup-card p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.prefix-icon { position: absolute; left: 16px; color: #94a3b8; }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .input-wrapper input:focus { border-color: #002366; outline: none; box-shadow: 0 0 0 4px rgba(0, 35, 102, 0.1); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #002366;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #001a4d; transform: translateY(-2px); }

        .auth-footer { margin-top: 20px; color: #64748b; font-size: 0.9rem; }
        .auth-footer a { color: #002366; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body class="signup-page">
    <div class="signup-card">
        <h2>Join the Portal</h2>
        <p class="subtitle">Create an account to start your journey</p>

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user prefix-icon"></i>
                    <input type="text" name="name" required placeholder="Your Name">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope prefix-icon"></i>
                    <input type="email" name="email" required placeholder="name@email.com">
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock prefix-icon"></i>
                    <input type="password" name="password" required placeholder="Min. 8 characters">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Create My Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('candidate_login') }}">Log in here</a></p>
        </div>
    </div>
</body>
</html>
