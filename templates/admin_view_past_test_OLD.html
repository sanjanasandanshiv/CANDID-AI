<body class="dashboard-body">

    <nav class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-briefcase"></i> <span>HR Panel</span>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li><a href="{{ url_for('admin_create_job') }}"><i class="fas fa-plus-square"></i> Create Job</a></li>
            <li class="active"><a href="#"><i class="fas fa-history"></i> View Past Tests</a></li>
            <li><a href="#"><i class="fas fa-users"></i> Applicants</a></li>
            <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <p>© 2026 Admin Portal</p>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-nav">
            <div class="user-greeting"></div>
            <div class="top-nav-actions">
                <span class="admin-badge">Admin Mode</span>
                <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
            </div>
        </header>

        <div class="container-fluid animate-slide-up">

            <div class="page-header">
                <h2><i class="fas fa-history"></i> Past Test Links</h2>
                <p>All test links generated per job role, and the candidates who have taken or been invited to the test.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-{{ category }} animate-fade-in">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if jobs_map %}
                {% for job_id, job in jobs_map.items() %}
                <div class="job-block animate-slide-up">

                    <div class="job-block-header">
                        <h3>
                            <i class="fas fa-briefcase"></i>
                            {{ job.job_title }}
                        </h3>
                        <span class="candidate-count-badge">
                            <i class="fas fa-users"></i>
                            {{ job.candidates | length }} candidate{{ 's' if job.candidates | length != 1 else '' }}
                        </span>
                    </div>

                    <div class="test-link-row">
                        <span class="test-link-label"><i class="fas fa-link"></i> Test Link</span>
                        <span class="test-link-url" id="link-{{ job_id }}">{{ job.test_link }}</span>
                        <button class="btn-copy" onclick="copyLink('link-{{ job_id }}', this)">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>

                    <div class="candidates-table-wrapper">
                        <table class="candidates-table">
                            <thead>
                                <tr>
                                    <th class="col-sr">#</th>
                                    <th><i class="fas fa-user" style="margin-right:6px;color:#94a3b8;"></i>Candidate Name</th>
                                    <th><i class="fas fa-tag" style="margin-right:6px;color:#94a3b8;"></i>Test Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for idx, candidate in job.candidates | enumerate %}
                                <tr>
                                    <td class="col-sr">{{ idx + 1 }}</td>
                                    <td>{{ candidate.name }}</td>
                                    <td>
                                        {% if candidate.status == 'Test Completed' %}
                                            <span class="status-pill status-completed">
                                                <i class="fas fa-check-circle"></i> Test Completed
                                            </span>
                                        {% else %}
                                            <span class="status-pill status-selected">
                                                <i class="fas fa-hourglass-half"></i> Selected for Test
                                            </span>
                                        {% endif %}
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>

                </div>
                {% endfor %}

            {% else %}
                <div class="empty-state animate-fade-in">
                    <i class="fas fa-inbox"></i>
                    <h3>No Past Tests Found</h3>
                    <p>No test links have been sent to any candidates yet. Generate an AI test and send links from the dashboard.</p>
                </div>
            {% endif %}

        </div>
    </main>

    <script>
        function copyLink(spanId, btn) {
            const text = document.getElementById(spanId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>

</body>
</html> -->
